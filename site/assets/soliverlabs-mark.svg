<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="1200" height="1200" fill="none">
  <defs>
    <!-- Background Surface -->
    <radialGradient id="helicalBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0c1932"/>
      <stop offset="70%" stop-color="#040d1a"/>
      <stop offset="100%" stop-color="#01060e"/>
    </radialGradient>

    <!-- Multi-Stage Radiant Gradients -->
    <linearGradient id="helixRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="helixRibbon2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="subtleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Tile -->
  <rect x="24" y="24" width="352" height="352" rx="84" fill="url(#helicalBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="25.5" y="25.5" width="349" height="349" rx="82.5" fill="none" stroke="url(#subtleStroke)" stroke-width="1"/>

  <!-- Quantum Helix Ribbon (Clean droplet / Möbius continuum with background shadow loop removed) -->
  <g transform="translate(200, 200)">
    <!-- Primary Foreground Fluid Loop (Mathematical S-Helix / Teardrop Continuum) -->
    <path d="M 54 28
             C 54 62, 22 82, -14 78
             C -46 74, -70 50, -70 20
             C -70 -8, -48 -34, -18 -52
             L 6 -32
             C -18 -16, -36 2, -36 18
             C -36 34, -24 46, -6 46
             C 12 46, 26 34, 26 18
             C 26 8, 20 0, 10 -6
             L 28 -24
             C 44 -12, 54 6, 54 28 Z"
          fill="url(#helixRibbon1)"/>

    <!-- Overlapping Highlight Crest (Adds physical depth and razor edge) -->
    <path d="M -18 -52
             C 10 -30, 48 -10, 54 28
             C 54 44, 44 60, 26 70
             L 10 52
             C 22 44, 28 34, 28 24
             C 24 -2, -4 -18, -26 -34
             Z"
          fill="url(#helixRibbon2)" opacity="0.95"/>

    <!-- Micro Focal Spark / Innovation Singularity Point -->
    <circle cx="2" cy="-2" r="3.5" fill="#ffffff"/>
  </g>
</svg>
